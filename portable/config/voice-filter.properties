# Text cleanup applied before local Piper speech synthesis.
# Changes take effect after restarting the application.
skipFencedCode=true
skipInlineCode=true
removeUrls=true
removeHtml=true
removeMarkdown=true
removeSymbols=true
# Removes keycap emoji and superscript/subscript decorations that can leave a
# digit behind and cause Piper to pronounce an unexpected "zero".
removeDecorativeCharacters=true
maxCharacters=2000
